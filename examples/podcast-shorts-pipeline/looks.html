<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shorts look template (ledger, whiteboard, flat2d, operator, none)</title>
<!--
  The GRAPHIC LAYER of a 1080x1920 short, rendered by pipeline.py through Chrome (Playwright, omitBackground)
  as a PNG with alpha at any output time t. Everything the video shows through (the face panels) is left
  transparent; the layer paints the ground above the panels, the held title, the look's graphic keyed to the
  spoken words, and the faded extension from y=1500 down (never a bar, never empty).

  Contract (pipeline.py -> window.setup(payload) once, then window.setTime(t) per frame, which returns a state
  signature so identical frames are hardlinked instead of re-shot):
    payload = { look, title, title_accent, eyebrow, credit, pov_line, held_top, band_text,
                hook_end (output s; -1 when there is no hook), duration,
                graphic: { kind: list|table|timeline|scene|screen|bars|none, items: [..], keys: [[label, t_out], ..],
                           source_line, clawd (true: the optional mascot illustration) }, screen_rect: [x,y,w,h] | null,
                layout: { hook: {top_band_h, host:[y,h], guest:[y,h]}, answer: {top_band_h, guest:[y,h]} } }
  Generalised from one design mockup per look (26 Oct night). Springs from springs.js beside this page
  (closed form, so any t is exact).
  Tokens: {{FONT_DIR}}, {{PIPELINE_DIR}}, {{LOGO_SVG}}, {{MASCOT_PNG}}, {{ACCENT}} and {{ACCENT_DARK}} are filled by
  paths.page_for_this_mac (a copy in the work folder) before the browser opens the page, so never open this file
  directly; the accent tokens must be #RRGGBB (the page does arithmetic on them).
  Safe frame: content/taste/shorts-formats.md. Title top at or below 290; nothing of ours in x>905 below y=960;
  captions are burned by libass, not here.
-->
<style>
@font-face { font-family: "DM Serif Display"; src: url("file://{{FONT_DIR}}/DMSerifDisplay-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Montserrat"; src: url("file://{{FONT_DIR}}/Montserrat-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Inter"; src: url("file://{{FONT_DIR}}/Inter[opsz,wght].ttf"); font-weight: 100 900; }
@font-face { font-family: "Menlo"; src: url("file:///System/Library/Fonts/Menlo.ttc"); }
:root {
  --ink: #1C1C1E; --accent-dark: {{ACCENT_DARK}}; --accent-light: {{ACCENT}}; --paper: #F7F6F2; --white: #FFFFFF;
  --rule: rgba(28,28,30,0.16); --rule-faint: rgba(28,28,30,0.06); --tint: color-mix(in srgb, {{ACCENT}} 18%, transparent);
  --ground: #F7F6F2; --fg: #1C1C1E; --accent: {{ACCENT_DARK}}; --mono: #1C1C1E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
body { position: relative; font-family: "Inter", sans-serif; color: var(--fg); }
#ground { position: absolute; left: 0; top: 0; width: 1080px; background: var(--ground); overflow: hidden; }
#gap { position: absolute; left: 0; width: 1080px; background: var(--ground); }
#fade { position: absolute; left: 0; top: 1500px; width: 1080px; height: 420px;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, var(--fade-70) 45%, var(--fade) 100%); }
/* ledger ruling, whiteboard rim */
body.ledger #ground { background-image: repeating-linear-gradient(to bottom, transparent 0 51px, var(--rule-faint) 51px 52px); }
body.whiteboard #ground { background: #FFFFFF; }
body.whiteboard #gap { background: #1C1C1E; }
body.whiteboard #rim { position: absolute; inset: 0; border: 14px solid #D7D7D3; box-shadow: inset 0 0 0 2px #EDEDEA; }
body.whiteboard #tray { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 14px; background: #C9C9C4; border-radius: 3px 3px 0 0; }
body.whiteboard #tray i { position: absolute; top: -9px; height: 9px; width: 50px; border-radius: 2px; }

/* eyebrow + title */
#eyebrow { position: absolute; left: 60px; right: 60px; top: 292px; height: 32px; white-space: nowrap; display: flex; justify-content: space-between;
  font-family: "Menlo", monospace; font-size: 24px; line-height: 32px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--mono); overflow: hidden; }
#eyebrow .no { color: var(--accent); }
#title { position: absolute; left: 60px; right: 60px; top: 260px; font-family: "DM Serif Display", serif; font-size: 84px; line-height: 1.0;   /* 28 Oct (polish, guest O's option D): 260, was 332 */
  letter-spacing: -0.005em; color: var(--fg); transform-origin: 0 0; }
body.whiteboard #title, body.flat2d #title, body.operator #title { font-family: "Inter", sans-serif; font-weight: 900; letter-spacing: -0.025em; line-height: 1.02; }

/* the graphic region */

/* rows (ledger table / whiteboard list / operator steps) */

body.whiteboard .row .lab, body.operator .row .lab, body.flat2d .row .lab { font-family: "Inter", sans-serif; font-weight: 800; letter-spacing: -0.015em; }
.row .box { position: relative; border: 4px solid var(--fg); border-radius: 6px; justify-self: end; }
.row .box svg { position: absolute; inset: -4px; overflow: visible; }

/* flow chips (flat2d scene) */
.chip { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 18px;

/* operator window */
#win { position: absolute; left: 0; top: 0; width: 960px; height: 360px; border-radius: 16px; background: #FFFFFF; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,0.35); }
#win .bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; background: #ECEEF0; border-bottom: 1px solid #D5D8DB; display: flex; align-items: center; padding-left: 20px; gap: 10px;
  font-family: "Inter", sans-serif; font-weight: 700; font-size: 44px; color: #3A3F45; white-space: nowrap; overflow: hidden; }

/* bars */
.bar-row { position: absolute; left: 0; width: 960px; }

#mascot { position: absolute; width: 170px; }
/* timeline (27 Oct, reviewers C1 and C2: scene, timeline and bars were chip grids) */
.tl-line { position: absolute; left: 0; width: 960px; height: 8px; background: var(--fg); border-radius: 4px; transform-origin: 0 50%; }

.actor { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); border: 4px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.chip { overflow: hidden; }
.tl-pin { position: absolute; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 26px solid var(--accent); }   /* under the line, pointing up (it covered the label above) */
.g-head { position: absolute; left: 0; right: 0; top: 0; font-family: "Inter", sans-serif; font-weight: 800; font-size: 44px; line-height: 1.1; color: var(--fg); opacity: 0.8; letter-spacing: -0.01em; }
#card { position: absolute; left: 0; right: 0; top: 0; border-radius: 22px; background: #FFFFFF; border: 4px solid var(--fg); padding: 26px 34px; box-shadow: 0 14px 40px rgba(0,0,0,0.12); }
body.operator #card { background: #1E2126; border-color: #F2F3F4; }
#card .ln { font-family: "DM Serif Display", serif; color: var(--fg); line-height: 1.12; margin: 0 0 6px 0; }
#card .ln .t { color: var(--accent); }
#card .lbl { position: absolute; right: 30px; bottom: 14px; font-family: "Menlo", monospace; font-size: 44px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.row .val { font-family: "DM Serif Display", serif; color: var(--accent); white-space: nowrap; justify-self: end; }
.g-src { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; font-family: "Menlo", monospace; font-size: 44px; line-height: 50px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--mono); white-space: nowrap; overflow: hidden; opacity: 0.85; }
#mark { position: absolute; left: 60px; top: 230px; width: 56px; height: 56px; }
#mark img { width: 56px; height: 56px; display: block; opacity: 0.9; }
/* (the creator, round-2 ruling 4): the credit is no chip and no Menlo line: the name (and "Full talk in the comments"
   only when the long form is live: a promise made on screen is a live link) as larger text at the bottom, inside the safe zone, in the last 6 s */
#source { display: none !important; }
#credit2 { position: absolute; left: 60px; right: 60px; top: 232px; text-align: center; font-family: "Montserrat", sans-serif; font-weight: 700;
  font-size: 48px; line-height: 1.05; color: var(--fg); display: none; }
/* (builder A, cause 5: on guest C's M2 and guest O's M1 the credit at y 1112 to 1160 ran across the guest's mouth): on the drawn
   looks the credit sits in the band, on the eyebrow's old line above the title (its foot at 326, the title from 332), in
   the look's ink, 48 px down to 44 and then 2 lines broken at the dot; ig_native keeps it at y 1400 in white, 60 px down
   to 44, then 2 lines */
body.ig_native #credit2 { left: 90px; right: 150px; top: 1400px; font-size: 60px; line-height: 1.15; color: #FFFFFF; text-shadow: 0 3px 8px rgba(0,0,0,0.6), 0 0 2px rgba(0,0,0,0.7);
  -webkit-text-stroke: 7px rgba(14,14,14,0.85); paint-order: stroke fill; }   /* 29 Oct (builder G, Round-3 I: white on guest C's light blouse): a dark outline under the white */
/* (builder A, cause 5: 'GUEST NAME · ON THE PODCAST' in Menlo caps at 26 px): no eyebrow on any look */
#eyebrow { display: none !important; }
/* ig_native (the creator's pick: option B of the Instagram-native study): full bleed, the app's own stickers, nothing of ours but text */
body.ig_native #ground, body.ig_native #gap, body.ig_native #fade, body.ig_native #eyebrow, body.ig_native #title, body.ig_native #sub,
body.ig_native #graphic, body.ig_native #source, body.ig_native #mark { display: none !important; }
#ig { display: none; position: absolute; inset: 0; font-family: "Montserrat", sans-serif; font-weight: 700; }
body.ig_native #ig { display: block; }
#ig .stk { display: inline; background: #FFFFFF; color: #000000; border-radius: 18px; padding: 6px 22px; line-height: 1.68;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
#ig-title { position: absolute; left: 90px; right: 90px; top: 238px; text-align: center; font-size: 56px; }
#ig-title .stk, #ig-callout .stk { white-space: nowrap; }
#ig-callout { position: absolute; left: 90px; right: 150px; text-align: center; font-size: 60px; }
#ig-callout .stk { background: #F81820; color: #FFFFFF; border-radius: 12px; }
#ig-list { position: absolute; left: 70px; width: 840px; font-size: 44px; }
#ig-list .it { position: absolute; left: 0; transform-origin: 0 50%; white-space: nowrap; }
#ig-list .it .stk { line-height: 1.5; border-radius: 14px; padding: 6px 18px; }
#ig-cap { position: absolute; left: 150px; width: 780px; top: 1556px; text-align: center; color: #FFFFFF; font-size: 52px; line-height: 1.2;
  text-shadow: 0 3px 6px rgba(0,0,0,0.55), 0 0 2px rgba(0,0,0,0.6); white-space: nowrap; }
#ig-cap .w { padding: 0 6px; border-radius: 10px; }
#ig-cap .w.on { background: #F41CC8; text-shadow: none; }
/* 29 Oct (builder G, guest C's F3 and M1 r3: white captions on a white-and-pale-blue blouse; Round-3 I "a caption on a light
   background sits in a box or takes a dark colour"): the caption sticker always sits in a dark translucent box, one box per
   line (box-decoration-break clone), the pink word box over it as before; under alpha 200 so the ink checks read it as before */
#ig-cap .ln { background: rgba(14,14,14,0.70); padding: 2px 12px; border-radius: 14px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
</style>
</head>
<body class="none">
<div id="ground"><div id="rim"></div></div>
<div id="gap"></div>
<div id="mark" style="display:none"><img src="{{LOGO_SVG}}" alt=""></div>
<div id="eyebrow"><span id="eyebrow-l"></span><span class="no" id="count"></span></div>
<div id="title"></div>
<div id="sub"></div>
<div id="graphic"></div>
<div id="source"></div>
<div id="fade"></div>
<div id="credit2"></div>
<div id="ig"><div id="ig-title"></div><div id="ig-callout"></div><div id="ig-list"></div><div id="ig-cap"></div></div>
<script src="file://{{PIPELINE_DIR}}/springs.js"></script>
<script>
(function () {
  const P = {};              // payload
  let rows = [], chips = [], bars = [], flow = null, rowKeyTimes = [], titleWords = [], tl = null, cardLines = [];
  let page = null, actor = null;   // 27 Oct: a window of PAGE items (rows, timeline dots, scene chips) and the scene's moving actor
  const PAGE = 4;
  const q = (s) => document.querySelector(s);
  const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; (parent || document.body).appendChild(e); return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const prog = (spring, t0, t) => (t0 == null || t < t0) ? 0 : spring.S(t - t0);   // 0..1, exact in t

  const GROUND = { ledger: "#F7F6F2", none: "#F7F6F2", whiteboard: "#FFFFFF", operator: "#15171A", flat2d: "#F3F7F8" };
  const FADE = { ledger: "#F7F6F2", none: "#F7F6F2", whiteboard: "#1C1C1E", operator: "#15171A", flat2d: "#F3F7F8" };
  const FG = { ledger: "#1C1C1E", none: "#1C1C1E", whiteboard: "#1C1C1E", operator: "#F2F3F4", flat2d: "#1C1C1E" };
  const ACC = { ledger: "{{ACCENT_DARK}}", none: "{{ACCENT_DARK}}", whiteboard: "{{ACCENT_DARK}}", operator: "{{ACCENT}}", flat2d: "{{ACCENT_DARK}}" };
  const hex2rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };

  function wobbleRect(w, h, seed) {
    let s = seed; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280 - 0.5; };
    const r = 14, j = 2.2, pts = [], steps = 10;
    const edge = (x0, y0, x1, y1) => { for (let k = 0; k <= steps; k++) { const t = k / steps; pts.push([x0 + (x1 - x0) * t + rnd() * j, y0 + (y1 - y0) * t + rnd() * j]); } };
    edge(r, 3, w - r, 3); edge(w - 3, r, w - 3, h - r); edge(w - r, h - 3, r, h - 3); edge(3, h - r, 3, r);
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let k = 1; k < pts.length; k++) d += ` L ${pts[k][0].toFixed(1)} ${pts[k][1].toFixed(1)}`;
    return d + " Z";
  }

  // ---- (builder A, cause 6: 'Have You Ever Had To Chase A' / 'Supplier?', 'Speed Is The Quiet Edge In' / 'Support',
  // 'Short Notes, Long' / 'Notes'): a title, a callout or a sticker is broken into balanced lines, never a word alone
  // on a line when the words allow 2 a line; the break prefers a comma or a full stop before it and a small word after
  // it ('In Support', 'To Chase A Supplier?'), and never leaves a line ending on 'a', 'the', 'to' and their kind.
  // wOf(text) is the drawn width of a line; null when no split into maxLines lines fits maxW.
  const SMALL_NEXT = /^(in|to|for|of|with|on|at|by|and|or|but|from|into|about|than|vs)$/i;
  const BAD_END = /^(a|an|the|to|of|and|or|in|on|is|i|but|so|that|with|for|at|my|your|our|if|by|from)$/i;
  function breakLines(words, wOf, maxW, maxLines) {
    const n = words.length, line = (i, j) => words.slice(i, j).join(" ");
    if (!n) return [[]];
    if (wOf(line(0, n)) <= maxW) return [words.slice()];
    for (let L = 2; L <= maxLines; L++) {
      let best = null;
      const check = (segs) => {
        const ws = segs.map(([i, j]) => wOf(line(i, j)));
        if (ws.some(w => w > maxW)) return;
        let c = (Math.max(...ws) - Math.min(...ws)) / maxW;
        segs.forEach(([i, j], si) => {
          if (j - i < 2 && n >= 2 * L) c += 10;
          if (si < segs.length - 1) {
            const last = words[j - 1], next = words[j], bare = x => x.replace(/[^A-Za-z']/g, "");
            if (BAD_END.test(bare(last))) c += 0.6;
            if (/[,.;:?!]$/.test(last)) c -= 0.35;
            if (SMALL_NEXT.test(bare(next))) c -= 0.6;
          }
        });
        if (!best || c < best.c) best = { c, segs };
      };
      const rec = (start, left, acc) => {
        if (left === 1) { check(acc.concat([[start, n]])); return; }
        for (let k = start + 1; k <= n - (left - 1); k++) rec(k, left - 1, acc.concat([[start, k]]));
      };
      rec(0, L, []);
      if (best) return best.segs.map(([i, j]) => words.slice(i, j));
    }
    return null;
  }
  // title case on every part of a hyphenated word ('4-Letter', '30-Page', 'Month-To-Month'), every word capitalised as
  // before (the Classic sticker's own habit)
  function capWord(w) { return String(w).split("-").map(x => x.replace(/^([^A-Za-z0-9]*)([a-z])/, (m, a, b) => a + b.toUpperCase())).join("-"); }
  function measurer(host, fontPx) {
    const pr = document.createElement("span"); pr.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;left:0;top:0;font-size:" + fontPx + "px";
    host.appendChild(pr);
    return { w: t => { pr.textContent = t; return pr.getBoundingClientRect().width; }, done: () => pr.remove() };
  }

  // ---- title: fit 2 lines inside 960, the accent phrase coloured, each word its own span for the TYPE entrance
  function buildTitle() {
    const T = q("#title"); T.innerHTML = "";
    const title = P.title || "", acc = (P.title_accent || "").trim();
    let i = acc ? title.toLowerCase().indexOf(acc.toLowerCase()) : -1;
    const parts = [];
    if (i >= 0) { parts.push([title.slice(0, i), false]); parts.push([title.slice(i, i + acc.length), true]); parts.push([title.slice(i + acc.length), false]); }
    else parts.push([title, false]);
    titleWords = [];
    const W = [];
    for (const [txt0, isAcc] of parts) {
      let txt = txt0;
      // trailing punctuation after the accent ("chase a supplier" + "?") stays on the word before it, never its own word
      const m = txt.match(/^([?.!,:;'"\u2019\u201d)]+)/);
      if (m && W.length) { W[W.length - 1].text += m[1]; txt = txt.slice(m[1].length); }
      for (const w of txt.split(/\s+/).filter(Boolean)) W.push({ text: w, acc: isAcc });
    }
    const render = (lines) => {
      T.innerHTML = ""; titleWords = []; let wi = 0;
      lines.forEach((ln, li) => {
        ln.forEach((t, k) => { const s = el("span", "w" + (W[wi].acc ? " t" : ""), T); s.textContent = W[wi].text; titleWords.push(s); wi++;
          if (k < ln.length - 1) T.appendChild(document.createTextNode(" ")); });
        if (li < lines.length - 1) T.appendChild(document.createElement("br"));
      });
    };
    // the title lives between y 332 and 500 (the hook's host panel starts at 516): 2 lines at most, 80 px down to 72,

      rows.forEach((row, i) => { const vis = i >= start && i < start + page.per; row.style.display = vis ? "" : "none"; if (vis) row.style.top = ((i - start) * page.rh + (page.off || 0)) + "px"; });
    }
    rows.forEach((row, i) => {
      const kt = rowKeyTimes[i]; const p = kt == null ? 1 : prog(S.MASK, kt, t); const drawn = kt == null ? 1 : prog(S.FADE, kt + 0.05, t);
      const pending = kt != null && t < kt; if (!pending && kt != null) lit++;
      row.className = "row " + (pending ? "pending" : "lit");
      const dimEl = row.querySelectorAll(".idx, .lab, .box, .dot");
      dimEl.forEach(e => e.style.opacity = pending ? 0.32 : (0.32 + 0.68 * drawn));
      const tint = row.querySelector(".tint"); if (tint) tint.style.transform = `scaleX(${pending ? 0 : p})`;
      const hair = row.querySelector(".hair"); if (hair) hair.style.transform = `scaleX(${gp})`;
      const path = row.querySelector(".box path"); if (path) path.style.strokeDashoffset = pending ? 50 : 50 * (1 - prog(S.MASK, (kt || 0) + 0.1, t));
      const idx = row.querySelector(".idx"); if (idx) idx.style.color = pending ? "" : "var(--accent)";
      const box = row.querySelector(".box"); if (box) box.style.borderColor = pending ? "" : "var(--accent)";
      const dot = row.querySelector(".dot"); if (dot) { dot.style.background = pending ? "transparent" : "var(--accent)"; dot.style.borderColor = pending ? "" : "var(--accent)"; }
      // (pass 3, guest Z's 13 s and guest T's 4 s of blank panel): a pending whiteboard row shows its number, its outline and a dim label from frame 0
      const num = row.querySelector(".num"); if (num) { num.style.borderColor = pending ? "" : "{{ACCENT_DARK}}"; num.style.background = pending ? "" : "{{ACCENT_DARK}}"; num.style.color = pending ? "" : "#fff"; num.style.opacity = pending ? 0.32 : drawn; }
      const wob = row.querySelector(".wob"); if (wob) { const st = wob.querySelector(".stroke"), fl = wob.querySelector(".fill"); const len = parseFloat(st.style.strokeDasharray);
        st.style.strokeDashoffset = pending ? 0 : len * (1 - prog(S.MASK, kt || 0, t)); fl.style.fillOpacity = pending ? 0 : 0.55 * drawn; st.style.stroke = pending ? "#1C1C1E" : "{{ACCENT_DARK}}"; st.style.opacity = pending ? 0.32 : 1;
        const lab = row.querySelector(".lab"); if (lab) lab.style.opacity = pending ? 0.32 : drawn; }
      sig.push(Math.round(p * 60), Math.round(drawn * 60));
    });
    // the ACTIVE chip (the latest key reached) is in the accent, the ones already said keep an accent outline, the rest wait dim
    let active = -1; chips.forEach((c, i) => { const kt = rowKeyTimes[i]; if (kt != null && t >= kt) active = i; });
    if (flow && chips.length > flow.perRow) {   // the scene's window
      const start = Math.max(0, active - (flow.perRow - 1)); sig.push(start);
      chips.forEach((chip, i) => { const vis = i >= start && i < start + flow.perRow; chip.style.display = vis ? "" : "none";
        if (vis) { const x = (i - start) * (flow.cw + flow.gapx); chip.style.left = x + "px"; if (chip._arrow) { chip._arrow.style.left = (x + flow.cw + 6) + "px"; chip._arrow.style.display = (i - start < flow.perRow - 1 && i < chips.length - 1) ? "" : "none"; } }
        else if (chip._arrow) chip._arrow.style.display = "none"; });
    } else if (flow) { chips.forEach((chip, i) => { if (chip._arrow) chip._arrow.style.display = i < chips.length - 1 ? "" : "none"; }); }
    if (actor && flow) {   // the actor rides to the active chip's centre on a UI spring
      const start = chips.length > flow.perRow ? Math.max(0, active - (flow.perRow - 1)) : 0;
      const cx = i => (i - start) * (flow.cw + flow.gapx) + flow.cw / 2;
      let ax = cx(Math.max(0, start));
      if (active >= 0) { const kt = rowKeyTimes[active]; const p = kt == null ? 1 : prog(S.UI, kt, t); const prev = Math.max(start, active - 1); ax = cx(prev) + (cx(active) - cx(prev)) * p; }
      actor.style.left = Math.round(ax - 15) + "px"; actor.style.opacity = active >= 0 ? 1 : 0.4; sig.push(Math.round(ax));
    }
    chips.forEach((chip, i) => {
      const kt = rowKeyTimes[i]; const pending = kt != null && t < kt; const p = kt == null ? 1 : prog(S.UI, kt, t);
      const isActive = i === active || (kt == null && active < 0);
      chip.style.opacity = pending ? 0.3 : 1; chip.style.transform = `scale(${pending ? 0.96 : 0.96 + 0.06 * p})`;
      chip.style.background = pending ? "#FFFFFF" : (isActive ? "{{ACCENT_DARK}}" : "#FFFFFF");
      chip.style.color = pending ? "" : (isActive ? "#FFFFFF" : "{{ACCENT_DARK}}"); chip.style.borderColor = pending ? "" : "{{ACCENT_DARK}}";
      if (chip._arrow) chip._arrow.style.opacity = pending ? 0.25 : 1;
      sig.push(Math.round(p * 60), isActive ? 1 : 0);
    });
    cardLines.forEach((d, i) => { const kt = rowKeyTimes[i]; const p = kt == null ? 1 : prog(S.UI, kt, t); const pending = kt != null && t < kt;
      d.style.opacity = pending ? 0.12 : 0.12 + 0.88 * p; d.style.transform = `translateY(${(1 - p) * 8}px)`; sig.push(Math.round(p * 60)); });
    if (tl) {
      tl.line.style.transform = `scaleX(${gp})`;
      let lastX = tl.xs[0], lastI = -1;
      if (tl.items.length > tl.slots) {   // the timeline's window: the latest PAGE events on the line
        let litN = 0; tl.items.forEach((it, i) => { const kt = rowKeyTimes[i]; if (kt != null && t >= kt) litN = i + 1; });
        const start = Math.max(0, litN - tl.slots); sig.push(start);
        tl.items.forEach((it, i) => { const vis = i >= start && i < start + tl.slots; it.dot.style.display = vis ? "" : "none"; it.lab.style.display = vis ? (it.side ? "flex" : "") : "none";
          if (vis) { const x = tl.slotX(i - start); tl.xs[i] = x; it.dot.style.left = (x - 17) + "px"; it.lab.style.left = (x - tl.lw / 2) + "px"; } });
      }
      tl.items.forEach((it, i) => {
        const kt = rowKeyTimes[i]; const pending = kt != null && t < kt; const p = kt == null ? 1 : prog(S.UI, kt, t);
        if (it.dot.style.display === "none") { sig.push(0); return; }
        it.dot.style.opacity = pending ? 0.25 : 1; it.dot.style.background = pending ? "" : "var(--accent)"; it.dot.style.borderColor = pending ? "" : "var(--accent)";
        it.dot.style.transform = `scale(${pending ? 0.8 : 0.8 + 0.35 * p})`;
        it.lab.style.opacity = pending ? 0 : p; it.lab.style.transform = `translateY(${(1 - p) * 10}px)`;
        if (!pending) { lastI = i; }
        sig.push(Math.round(p * 60));
      });
      if (lastI >= 0) { const kt = rowKeyTimes[lastI]; const p = kt == null ? 1 : prog(S.UI, kt, t); const prevX = lastI > 0 ? tl.xs[lastI - 1] : tl.xs[0]; lastX = prevX + (tl.xs[lastI] - prevX) * p; }
      tl.pin.style.left = Math.round(lastX - 16) + "px"; tl.pin.style.opacity = lastI >= 0 ? 1 : 0.35; sig.push(Math.round(lastX));
    }
    bars.forEach((b, i) => { const kt = rowKeyTimes[i]; const p = kt == null ? 1 : prog(S.CARD, kt, t); b.fill.style.transform = `scaleX(${p})`; b.val.style.opacity = p; b.el.style.opacity = kt != null && t < kt ? 0.35 : 1; sig.push(Math.round(p * 60)); });
    q("#count").textContent = "";
    sig.push("c" + cr);
    return sig.join(",");
  };
})();
